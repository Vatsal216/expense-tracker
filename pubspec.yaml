name: expense_tracker
description: Local-first Android expense tracker with SMS/UPI automation and user-controlled finance tools.
publish_to: "none"
version: 2.5.0+21
environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2+1
  path: ^1.9.1
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  path_provider: ^2.1.5
  share_plus: ^12.0.0
  cross_file: ^0.3.5
  file_picker: ^10.3.3
  cryptography: ^2.7.0
  local_auth: ^2.3.0
  pdf: ^3.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
