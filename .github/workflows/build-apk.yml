name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter Android project
        run: |
          mkdir -p /tmp/expense_backup
          cp -R lib /tmp/expense_backup/lib
          cp pubspec.yaml /tmp/expense_backup/pubspec.yaml
          cp -R android/app/src/main /tmp/expense_backup/android_main

          flutter create . \
            --project-name expense_tracker \
            --org com.example \
            --platforms android \
            --overwrite

          rm -rf lib
          cp -R /tmp/expense_backup/lib lib
          cp /tmp/expense_backup/pubspec.yaml pubspec.yaml
          cp -R /tmp/expense_backup/android_main/. android/app/src/main/

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
